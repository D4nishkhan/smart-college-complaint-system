{% extends "base.html" %}
{% block content %}
<div class="p-4 rounded-4 card-glass">
  <h3 class="fw-bold mb-3">Principal Login</h3>
  <form method="post">
    <label class="form-label text-soft">Username</label>
    <input class="form-control form-control-lg ui-input mb-3" name="username" value="principal" required>

    <label class="form-label text-soft">Secret</label>
    <input type="password" class="form-control form-control-lg ui-input mb-3" name="secret" required>

    <button class="btn btn-danger fw-bold">Continue</button>
  </form>
</div>
{% endblock %}
