{% extends "base.html" %}
{% block content %}

<div class="row g-3">
  <div class="col-lg-7">
    <div class="p-4 rounded-4 card-glass">
      <h3 class="fw-bold mb-3">Teacher Register (Request)</h3>

      {% if okmsg %}
        <div class="alert alert-success">{{ okmsg }}</div>
      {% endif %}
      {% if msg %}
        <div class="alert alert-danger">{{ msg }}</div>
      {% endif %}

      <form method="post">
        <label class="form-label text-soft">Name</label>
        <input class="form-control form-control-lg ui-input mb-3" name="name" required>

        <label class="form-label text-soft">Email</label>
        <input class="form-control form-control-lg ui-input mb-3" name="email" required>

        <label class="form-label text-soft">Password</label>
        <input type="password" class="form-control form-control-lg ui-input mb-3" name="password" required>

        <button class="btn btn-warning fw-bold">Send Request</button>
        <a class="btn btn-outline-light fw-bold ms-2" href="/teacher/login">Go to Login</a>
      </form>
    </div>
  </div>

  <div class="col-lg-5">
    <div class="p-4 rounded-4 card-glass">
      <h5 class="fw-bold">Employee Code</h5>
      <p class="text-soft mb-0">
        Employee code teacher enter nahi karega. Principal approve time pe auto assign hoga (EMP00001 style).
      </p>
    </div>
  </div>
</div>

{% endblock %}
