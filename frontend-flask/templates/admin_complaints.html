{% extends "base.html" %}
{% set title = "Admin - Complaints" %}

{% block content %}
<h2>Admin Panel</h2>
<p>Update complaint status (PENDING → IN_PROGRESS → RESOLVED)</p>

<article>
  <h3>All Complaints ({{ complaints|length }})</h3>
  <figure>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Department</th>
          <th>Current Status</th>
          <th>Update</th>
        </tr>
      </thead>
      <tbody>
        {% for c in complaints %}
        <tr>
          <td>{{ c.id }}</td>
          <td>{{ c.title }}</td>
          <td>{{ c.department.name if c.department else "-" }}</td>
          <td>{{ c.status }}</td>
          <td>
            <form method="POST" style="margin:0;">
              <input type="hidden" name="complaint_id" value="{{ c.id }}">
              <select name="status" required>
                <option value="PENDING" {% if c.status=="PENDING" %}selected{% endif %}>PENDING</option>
                <option value="IN_PROGRESS" {% if c.status=="IN_PROGRESS" %}selected{% endif %}>IN_PROGRESS</option>
                <option value="RESOLVED" {% if c.status=="RESOLVED" %}selected{% endif %}>RESOLVED</option>
              </select>
              <button type="submit">Save</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </figure>
</article>
{% endblock %}
