{% extends "base.html" %}
{% block content %}

<div class="p-4 rounded-4 card-glass mb-3">
  <h2 class="fw-bold mb-1">Principal Portal</h2>
  <p class="text-light text-opacity-75 mb-0">
    Hover any field → bot will peek and say Hello Principal.
  </p>
</div>

<div class="row g-3">
  <div class="col-lg-6">
    <div class="p-4 rounded-4 card-glass">
      <h4 class="fw-bold mb-3">Principal Credentials</h4>

      <div class="mb-3 peek-host">
        <label class="form-label text-light text-opacity-75">Username</label>
        <input data-bot="principal" class="form-control form-control-lg ui-input" placeholder="principal">
      </div>

      <div class="mb-3 peek-host">
        <label class="form-label text-light text-opacity-75">Secret</label>
        <input data-bot="principal" type="password" class="form-control form-control-lg ui-input" placeholder="college@2026">
      </div>

      <button class="btn btn-danger fw-bold">Save</button>
      <div class="small text-light text-opacity-75 mt-2">
        Use headers: X-PRINCIPAL-USERNAME & X-PRINCIPAL-SECRET
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="p-4 rounded-4 card-glass">
      <h4 class="fw-bold mb-3">Actions (Demo UI)</h4>

      <div class="mb-3 peek-host">
        <label class="form-label text-light text-opacity-75">Teacher ID</label>
        <input data-bot="principal" class="form-control form-control-lg ui-input" placeholder="3">
      </div>

      <div class="mb-3 peek-host">
        <label class="form-label text-light text-opacity-75">Complaint ID</label>
        <input data-bot="principal" class="form-control form-control-lg ui-input" placeholder="12">
      </div>

      <div class="mb-3 peek-host">
        <label class="form-label text-light text-opacity-75">Status</label>
        <select data-bot="principal" class="form-select form-select-lg ui-input">
          <option>PENDING</option>
          <option>IN_PROGRESS</option>
          <option>SOLVED</option>
        </select>
      </div>

      <button class="btn btn-outline-light fw-bold">Update Status</button>
    </div>
  </div>
</div>

{% endblock %}
