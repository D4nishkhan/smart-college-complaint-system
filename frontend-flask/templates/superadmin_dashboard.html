{% extends "base.html" %}
{% set title = "Principal Dashboard" %}

{% block content %}
<h2>Principal Dashboard</h2>

<article>
  <h3>All Complaints ({{ complaints|length }})</h3>
  <figure>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Department</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for c in complaints %}
        <tr>
          <td>{{ c.id }}</td>
          <td>{{ c.title }}</td>
          <td>{{ c.department.name if c.department else "-" }}</td>
          <td>{{ c.status }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </figure>
</article>
{% endblock %}
