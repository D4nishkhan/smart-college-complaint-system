<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title if title else "Smart College Service and Complaint Management System" }}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="app-bg">

<nav class="navbar navbar-dark nav-glass border-bottom border-light border-opacity-10 sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">Smart College</a>

    <div class="d-flex gap-2 flex-wrap">
      <a class="btn btn-sm btn-outline-light" href="/">Home</a>
      <a class="btn btn-sm btn-outline-info" href="/student">Student</a>
      <a class="btn btn-sm btn-outline-warning" href="/teacher">Teacher</a>
      <a class="btn btn-sm btn-outline-danger" href="/principal">Principal</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

</body>
</html>
